name: Publish Package to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 1: Set up a clean Node environment for installing dependencies
      - name: Setup Node.js for Installation
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install

      - name: Build Package
        run: npm run build

      # Step 2: Inject the authenticated npm registry context ONLY for publishing
      - name: Setup Node.js for Publishing
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npmjs.org'

      # Step 3: Run the deployment securely
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
